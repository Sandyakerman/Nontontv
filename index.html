<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SandyAckerman - Control Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold text-emerald-400">SANDYACKERMAN HUB</h1>
            <p class="text-xs text-slate-400">Central Automation System</p>
        </div>
        <span class="bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/20 font-mono">
            ● Online
        </span>
    </header>

    <main class="p-4 max-w-lg mx-auto space-y-5">

        <!-- Info Ringkas -->
        <section class="grid grid-cols-2 gap-3">
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                <p class="text-xs text-slate-400">Total Modul</p>
                <p class="text-xl font-bold text-white mt-1">2 Active Modules</p>
            </div>
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                <p class="text-xs text-slate-400">Server Hosting</p>
                <p class="text-xl font-bold text-emerald-400 mt-1">GitHub Pages</p>
            </div>
        </section>

        <!-- Kontrol Otomasi -->
        <section class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
            <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-bolt text-amber-400"></i> Kontrol Otomasi
            </h2>
            
            <div class="space-y-2 pt-1">
                <!-- Tombol Twitter / X -->
                <button onclick="runModule('Twitter Auto-Post')" class="w-full bg-sky-500 hover:bg-sky-600 active:scale-95 transition text-white py-2.5 px-4 rounded-lg text-sm font-medium flex items-center justify-between">
                    <span><i class="fa-brands fa-x-twitter mr-2"></i> Trigger Tweet Otomatis</span>
                    <i class="fa-solid fa-play text-xs"></i>
                </button>

                <!-- Tombol Google Indexer -->
                <button onclick="runModule('Google Indexer')" class="w-full bg-slate-700 hover:bg-slate-600 active:scale-95 transition text-white py-2.5 px-4 rounded-lg text-sm font-medium flex items-center justify-between">
                    <span><i class="fa-solid fa-magnifying-glass mr-2"></i> Run Search Indexer</span>
                    <i class="fa-solid fa-play text-xs"></i>
                </button>
            </div>
        </section>

        <!-- Daftar Aset Web / Sub-Proyek -->
        <section class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
            <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-folder-tree text-sky-400"></i> Modul Aktif
            </h2>
            
            <div class="space-y-2">
                <a href="#" class="block p-3 bg-slate-900/50 hover:bg-slate-900 rounded-lg border border-slate-700/50 flex justify-between items-center">
                    <div>
                        <p class="text-sm font-medium text-slate-200">Nontontv / Movievy Hub</p>
                        <p class="text-xs text-slate-500">Redirect & Media Traffic Engine</p>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-400"></i>
                </a>

                <a href="#" class="block p-3 bg-slate-900/50 hover:bg-slate-900 rounded-lg border border-slate-700/50 flex justify-between items-center">
                    <div>
                        <p class="text-sm font-medium text-slate-200">Menu QR Dinamis</p>
                        <p class="text-xs text-slate-500">Katalog UMKM / B2B System</p>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-400"></i>
                </a>
            </div>
        </section>

        <!-- Log Output -->
        <section class="bg-slate-950 p-3 rounded-xl border border-slate-800 font-mono text-xs text-slate-400">
            <p id="log-output" class="text-emerald-400">> System Ready. Twitter Bot Module Connected.</p>
        </section>

    </main>

    <script>
        function runModule(name) {
            const log = document.getElementById('log-output');
            log.innerText = `> Mengirim sinyal perintah ke [${name}]...`;
            setTimeout(() => {
                log.innerText = `> Sinyal [${name}] berhasil dikirim!`;
            }, 1200);
        }
    </script>
</body>
</html>
